# Runs on the VM in /opt/kumbet. The kumbet:latest image is loaded by GitHub Actions.
services:
  app:
    image: kumbet:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}

  # Caddy obtains and renews the HTTPS certificate automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
