# Every push to main: tests → (if the server is configured) build Docker image → copy to VM → restart → health check.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tests
        run: npm ci && npm test

      - name: Check server config
        id: check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -n "$VM_HOST" ] && [ -n "$VM_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ Deploy skipped: VM_HOST and VM_SSH_KEY secrets are not set (see DEPLOY.md)" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: test
    if: needs.test.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER || 'deploy' }}
    steps:
      - uses: actions/checkout@v4

      - name: Site address
        run: |
          DOMAIN="${{ secrets.DOMAIN }}"
          # Without a custom domain, fall back to free sslip.io: 34.1.2.3 → 34-1-2-3.sslip.io
          [ -z "$DOMAIN" ] && DOMAIN="${VM_HOST//./-}.sslip.io"
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: kumbet:latest
          outputs: type=docker,dest=/tmp/kumbet.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Bootstrap VM (first run only)
        run: |
          scp deploy/bootstrap.sh "$VM_USER@$VM_HOST:/tmp/bootstrap.sh"
          ssh "$VM_USER@$VM_HOST" "sudo bash /tmp/bootstrap.sh $VM_USER"

      - name: Deploy
        run: |
          gzip -1 /tmp/kumbet.tar
          scp /tmp/kumbet.tar.gz deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh "$VM_USER@$VM_HOST:/opt/kumbet/"
          ssh "$VM_USER@$VM_HOST" bash -se <<EOF
            set -euo pipefail
            cd /opt/kumbet
            chmod +x backup.sh
            printf 'DOMAIN=%s\nADMIN_USERNAMES=%s\n' "$DOMAIN" "${{ secrets.ADMIN_USERNAMES }}" > .env
            ./backup.sh predeploy
            gunzip -c kumbet.tar.gz | docker load
            rm kumbet.tar.gz
            docker compose up -d --remove-orphans
            docker image prune -f >/dev/null
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/api/health" | grep -q "\"$VERSION\""; then
              echo "✅ Version $VERSION is live: https://$DOMAIN"
              echo "### ✅ Deployed $VERSION → https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Site is not responding. Recent logs:"
          ssh "$VM_USER@$VM_HOST" "cd /opt/kumbet && docker compose logs --tail=80"
          exit 1
